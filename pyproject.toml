[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-exafs"
version = "0.0.1"
description = "Graph Neural Network to predict EXAFS spectra"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Javier Heras-Domingo", email = "javier.heras@ub.es"},
    { name = "Andrea Ruiz-Ferrando", email = "andrea.ruiz.ferrando@chem.ethz.ch"}
]
keywords = ["X-ray Absorption Spectroscopy", "Deep Learning", "Smart Characterization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/LopezGroup-ICIQ/ai-exafs"

[tool.setuptools]
packages = ["ai-exafs"]
