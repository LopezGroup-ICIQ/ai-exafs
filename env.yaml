name: ai-exafs
channels:
    - conda-forge
dependencies:
    - python=3.11.*
    - pip
    - pre-commit
    - numpy
    - scipy
    - pandas
    - matplotlib
    - seaborn
    - pymatgen
    - ase
    - pip:
        - --extra-index-url https://download.pytorch.org/whl/cu126
        - torch==2.9.1+cu126
        - torch_geometric==2.8.0.post1
        - lightning==2.6.5
        - xraydb
        - lmfit
        - xraylarch
        - hydra-core
        - wandb
        - lmdb
        - rich>=14.1,<15
        - scikit-learn
        - optuna
        - optuna-integration
